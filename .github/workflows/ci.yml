name: C++ CI

"on":
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"

jobs:
  clang-format:
    name: clang-format (Google)
    runs-on: ubuntu-latest
    container:
      image: silkeh/clang:20
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files cpp | grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' || true)"
          if [ -z "${files}" ]; then
            echo "No C/C++ files under cpp/. Skipping."
            exit 0
          fi
          # użyje cpp/.clang-format (style=file)
          echo "${files}" | xargs -r clang-format --style=file --dry-run --Werror

  build-and-test:
    name: Build & Test (${{ matrix.toolchain.name }})
    runs-on: ubuntu-latest
    needs: [clang-format]

    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: gcc-15.2
            image: gcc:15.2
            cc: gcc
            cxx: g++
          - name: clang-20
            image: silkeh/clang:20
            cc: clang
            cxx: clang++

    container:
      image: ${{ matrix.toolchain.image }}

    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            cmake ninja-build ccache
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=${GITHUB_WORKSPACE}/.ccache
          ccache --set-config=max_size=300M
          ccache --zero-stats

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.toolchain.name }}-${{ hashFiles('.github/workflows/cpp-ci.yml', 'cpp/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.toolchain.name }}-

      - name: Configure
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: |
          cmake -S cpp -B build/${{ matrix.toolchain.name }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLC_ENABLE_WERROR=ON

      - name: Build
        run: cmake --build build/${{ matrix.toolchain.name }} -- -k 0

      - name: Test
        run: ctest --test-dir build/${{ matrix.toolchain.name }} --output-on-failure

      - name: ccache stats
        if: always()
        run: ccache --show-stats